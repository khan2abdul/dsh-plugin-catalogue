<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness — Plugin Catalogue</title>
    <meta
      name="description"
      content="Every DeepSeek Harness plugin, bundle and agent preset: what each one does, how the desktop profile mounts it, and how to build your own."
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the stored theme before the module graph runs, using the same
      // attribute the shipped Harness dark tokens are keyed on.
      try {
        if (localStorage.getItem('dsh-catalogue-theme') === 'dark') {
          document.body.setAttribute('data-ds-dark-theme', '');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
